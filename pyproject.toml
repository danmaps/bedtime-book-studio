[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bedtime-book-studio"
version = "0.1.0"
description = "AI Agent Skill & MCP Server for turning a photo and bedtime story idea into an interactive mobile-friendly landscape picture book (with Lift-the-Flap support)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
  "pillow>=10.0.0",
  "mcp>=1.0.0",
]

[project.scripts]
bedtime-book-studio = "scripts.book_studio:main"
